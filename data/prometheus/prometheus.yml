global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "catalyst-services"
    static_configs:
      - targets:
          - "api-gateway:3000"
          - "management-service:3001"
          - "query-api-service:3003"
          - "ingest-service:3004"
          - "validate-enrich-service:9101"
          - "stream-processor-service:9103"
        labels:
          project: catalyst

  - job_name: "redpanda"
    static_configs:
      - targets:
          - "redpanda:9644"

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"
