services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.11
    container_name: catalyst-redpanda
    command: >
      redpanda start
      --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      --advertise-kafka-addr internal://redpanda:29092,external://localhost:9092
      --rpc-addr redpanda:33145
      --advertise-rpc-addr redpanda:33145
      --smp 1
      --memory 1G
    ports:
      - "9092:9092"
      - "29092:29092"
      - "33145:33145"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    environment:
      - REDPANDA_ADMIN_API_ADDRESSES=0.0.0.0:9644

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.3.8
    container_name: catalyst-redpanda-console
    ports:
      - "8080:8080"
    environment:
      - KAFKA_BROKERS=redpanda:29092
      - KAFKA_TLS_ENABLED=false

  redis:
    image: redis:7-alpine
    container_name: catalyst-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  postgres-timescale:
    image: timescale/timescaledb:2.13.0-pg16
    container_name: catalyst-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=catalyst
      - POSTGRES_PASSWORD=catalyst
      - POSTGRES_DB=catalyst
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_preload_libraries=timescaledb
      -c max_connections=100

  clickhouse:
    image: clickhouse/clickhouse-server:23.12-alpine
    container_name: catalyst-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_DB=catalyst
      - CLICKHOUSE_USER=catalyst
      - CLICKHOUSE_PASSWORD=catalyst
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  redpanda-data:
  redis-data:
  postgres-data:
  clickhouse-data: